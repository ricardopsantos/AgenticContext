<svg viewBox="0 0 1080 1335" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1080" height="1335" fill="#ffffff"/>
  <text x="540" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">The algorithm — sequence view</text>
  <text x="540" y="44" text-anchor="middle" font-size="11" fill="#666">one session, top to bottom · numbered circles match the steps in TLDR.md</text>

  <!-- legend -->
  <g font-size="9.5" fill="#555">
    <line x1="800" y1="16" x2="828" y2="16" stroke="#333" stroke-width="1.5" marker-end="url(#call)"/>
    <text x="833" y="19">call</text>
    <line x1="800" y1="30" x2="828" y2="30" stroke="#333" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ret)"/>
    <text x="833" y="33">return / warning</text>
    <circle cx="810" cy="44" r="8" fill="#1a56db"/>
    <text x="810" y="47.5" text-anchor="middle" font-size="8" fill="#fff" font-weight="bold">N</text>
    <text x="823" y="47">= step N in TLDR.md</text>
  </g>

  <defs>
    <marker id="call" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="ret" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#777"/>
    </marker>
    <marker id="callBold" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#8a5a00"/>
    </marker>
  </defs>

  <!-- actor headers -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="50"  y="60" width="200" height="36" rx="5" fill="#f2f2f2" stroke="#ccc"/>
    <text x="150" y="76" fill="#1a1a1a">AGENT</text>
    <text x="150" y="90" font-size="8.5" font-weight="normal" fill="#666">you / any terminal agent</text>

    <rect x="320" y="60" width="200" height="36" rx="5" fill="#f2f2f2" stroke="#ccc"/>
    <text x="420" y="76" fill="#1a1a1a">SCRIPTS</text>
    <text x="420" y="90" font-size="8.5" font-weight="normal" fill="#666">rebuild-index.sh · validate.sh · confirm-summary.sh</text>

    <rect x="590" y="60" width="200" height="36" rx="5" fill="#f2f2f2" stroke="#ccc"/>
    <text x="690" y="76" fill="#1a1a1a">DISK</text>
    <text x="690" y="90" font-size="8.5" font-weight="normal" fill="#666">files + generated INDEX.md + .summary-hashes</text>

    <rect x="860" y="60" width="200" height="36" rx="5" fill="#f2f2f2" stroke="#ccc"/>
    <text x="960" y="76" fill="#1a1a1a">HUMAN</text>
    <text x="960" y="90" font-size="8.5" font-weight="normal" fill="#666">approves / judges</text>
  </g>

  <!-- lifelines -->
  <g stroke="#ccc" stroke-width="1.2" stroke-dasharray="4 3">
    <line x1="150" y1="96" x2="150" y2="1244"/>
    <line x1="420" y1="96" x2="420" y2="1244"/>
    <line x1="690" y1="96" x2="690" y2="1244"/>
    <line x1="960" y1="96" x2="960" y2="1244"/>
  </g>

  <!-- BAND 0: THE TRIGGER — distinct from the automated loop below -->
  <rect x="40" y="106" width="1000" height="135" fill="#fff9ec" stroke="#e0ad2e" stroke-width="2"/>
  <rect x="40" y="106" width="320" height="20" fill="#8a5a00"/>
  <text x="50" y="120.5" font-size="11.5" font-weight="bold" fill="#fff">0 · YOU START THIS — nothing below is automatic</text>
  <text x="50" y="140" font-size="10" font-style="italic" fill="#7a5200">MAIN_PROMPT.md is what teaches the agent this entire flow — an agent that was never handed it will never look inside the folder.</text>

  <circle cx="70" cy="169" r="9" fill="#8a5a00"/><text x="70" y="172.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">0</text>
  <line x1="960" y1="169" x2="150" y2="169" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#callBold)"/>
  <text x="555" y="163" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a5a00">paste MAIN_PROMPT.md into a fresh session (or point your tool's rules file at it)</text>

  <line x1="150" y1="196" x2="690" y2="196" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="190" text-anchor="middle" font-size="10.5" fill="#333">discover root — walk up from cwd, match by contents, never by name</text>

  <line x1="150" y1="223" x2="690" y2="223" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="217" text-anchor="middle" font-size="10.5" fill="#333">read AGENTS.md — the rules</text>

  <!-- BAND A: EVERY SESSION -->
  <rect x="40" y="261" width="1000" height="251" fill="#f5f8ff" stroke="#c7d9fb" stroke-width="1"/>
  <rect x="40" y="261" width="150" height="18" fill="#c7d9fb"/>
  <text x="47" y="274" font-size="10.5" font-weight="bold" fill="#1a56db">EVERY SESSION</text>

  <circle cx="70" cy="305" r="9" fill="#1a56db"/><text x="70" y="308.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <line x1="150" y1="305" x2="420" y2="305" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="285" y="299" text-anchor="middle" font-size="10.5" fill="#333">rebuild_index()</text>

  <line x1="420" y1="332" x2="690" y2="332" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="326" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> scrape every &gt; summary: / description:</text>

  <line x1="690" y1="359" x2="420" y2="359" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="555" y="353" text-anchor="middle" font-size="10.5" fill="#555">filenames + summaries</text>

  <line x1="420" y1="386" x2="690" y2="386" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="380" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> write INDEX.md + refresh fingerprints (.summary-hashes)</text>

  <circle cx="70" cy="413" r="9" fill="#1a56db"/><text x="70" y="416.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <line x1="150" y1="413" x2="420" y2="413" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="285" y="407" text-anchor="middle" font-size="10.5" fill="#333">validate()</text>

  <line x1="420" y1="440" x2="690" y2="440" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="434" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">validate.sh:</tspan> check summaries, strays, index freshness, hash drift</text>

  <line x1="690" y1="467" x2="150" y2="467" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="420" y="461" text-anchor="middle" font-size="10.5" fill="#555">OK — or UNCONFIRMED: &lt;file&gt; (warns, exit 0 → resolved in step 11)</text>

  <circle cx="70" cy="494" r="9" fill="#1a56db"/><text x="70" y="497.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3</text>
  <line x1="150" y1="494" x2="690" y2="494" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="488" text-anchor="middle" font-size="10.5" fill="#333">load [CORE] docs + INDEX one-liners (~6.5k tok)</text>

  <!-- BAND B: PER TASK -->
  <rect x="40" y="522" width="1000" height="116" fill="#fff8f0" stroke="#f3d9ae" stroke-width="1"/>
  <rect x="40" y="522" width="260" height="18" fill="#f3d9ae"/>
  <text x="47" y="535" font-size="10.5" font-weight="bold" fill="#b5620a">PER TASK — repeats many times a session</text>

  <circle cx="70" cy="566" r="9" fill="#b5620a"/><text x="70" y="569.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4</text>
  <line x1="150" y1="566" x2="690" y2="566" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="560" text-anchor="middle" font-size="10.5" fill="#333">scan INDEX one-liners — KNOWLEDGE first, MEMORY only if it didn't answer</text>

  <circle cx="70" cy="593" r="9" fill="#b5620a"/><text x="70" y="596.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5</text>
  <line x1="150" y1="593" x2="690" y2="593" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="587" text-anchor="middle" font-size="10.5" fill="#333">open the matching doc only (600–2.4k tok vs ~30 tok per index line)</text>

  <circle cx="70" cy="620" r="9" fill="#b5620a"/><text x="70" y="623.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">6</text>
  <line x1="150" y1="620" x2="690" y2="620" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="614" text-anchor="middle" font-size="10.5" fill="#333">if a MEMORY finding answered it, append domain to Used in: — then rebuild</text>

  <!-- BAND C: AFTER TASK -->
  <rect x="40" y="648" width="1000" height="116" fill="#f2fbf5" stroke="#b9e4c4" stroke-width="1"/>
  <rect x="40" y="648" width="150" height="18" fill="#b9e4c4"/>
  <text x="47" y="661" font-size="10.5" font-weight="bold" fill="#1e7e34">AFTER TASK</text>

  <circle cx="70" cy="692" r="9" fill="#1e7e34"/><text x="70" y="695.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">7</text>
  <line x1="150" y1="692" x2="690" y2="692" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="686" text-anchor="middle" font-size="10.5" fill="#333">write finding — only if non-obvious + will recur + too narrow for KNOWLEDGE</text>

  <circle cx="70" cy="719" r="9" fill="#1e7e34"/><text x="70" y="722.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">8</text>
  <line x1="150" y1="719" x2="420" y2="719" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="285" y="713" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">gate:</tspan> validate.sh --content, then rebuild_index()</text>

  <line x1="420" y1="746" x2="690" y2="746" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="740" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> re-scrape + rewrite INDEX.md — the new finding now appears</text>

  <!-- BAND D: OVER TIME -->
  <rect x="40" y="774" width="1000" height="470" fill="#faf5ff" stroke="#ddc6fb" stroke-width="1"/>
  <rect x="40" y="774" width="150" height="18" fill="#ddc6fb"/>
  <text x="47" y="787" font-size="10.5" font-weight="bold" fill="#7e3ff2">OVER TIME</text>

  <text x="60" y="809" font-size="10" font-weight="bold" fill="#7e3ff2" font-style="italic">promotion</text>

  <circle cx="70" cy="832" r="9" fill="#7e3ff2"/><text x="70" y="835.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">9</text>
  <path d="M 420 826 h 34 v 12 h -34" stroke="#333" stroke-width="1.3" fill="none" marker-end="url(#call)"/>
  <text x="464" y="824" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> at each rebuild, count distinct Used in: domains per finding</text>

  <line x1="420" y1="859" x2="690" y2="859" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="853" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> tag index entry [PROMOTE? auto — used in N domains] if N ≥ 3</text>

  <line x1="690" y1="886" x2="150" y2="886" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="420" y="880" text-anchor="middle" font-size="10.5" fill="#555">agent's next load sees it — MEMORY/INDEX.md now lists [PROMOTE? auto …]</text>

  <line x1="150" y1="913" x2="960" y2="913" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="907" text-anchor="middle" font-size="10.5" fill="#333">surface the candidate — "graduate this into KNOWLEDGE?"</text>

  <line x1="960" y1="940" x2="150" y2="940" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="555" y="934" text-anchor="middle" font-size="10.5" fill="#555">approve / decline — never automatic (promotion ≠ [CORE])</text>

  <line x1="150" y1="967" x2="690" y2="967" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="961" text-anchor="middle" font-size="10.5" fill="#333">fold into KNOWLEDGE (or into a doc that already covers it); mark finding [STALE]</text>

  <text x="60" y="991" font-size="10" font-weight="bold" fill="#7e3ff2" font-style="italic">supersede</text>

  <circle cx="70" cy="1014" r="9" fill="#7e3ff2"/><text x="70" y="1017.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">10</text>
  <line x1="150" y1="1014" x2="690" y2="1014" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="420" y="1008" text-anchor="middle" font-size="10.5" fill="#333">supersede — write replacement, mark old summary [STALE], never delete</text>

  <line x1="420" y1="1041" x2="690" y2="1041" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="1035" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">rebuild-index.sh:</tspan> move [STALE] entries to a superseded tail</text>

  <text x="60" y="1066" font-size="10" font-weight="bold" fill="#7e3ff2" font-style="italic">staleness</text>

  <circle cx="70" cy="1089" r="9" fill="#7e3ff2"/><text x="70" y="1092.5" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">11</text>
  <line x1="420" y1="1089" x2="150" y2="1089" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="285" y="1083" text-anchor="middle" font-size="10.5" fill="#555"><tspan font-weight="bold">validate.sh:</tspan> UNCONFIRMED — body drifted past its confirmed summary</text>

  <line x1="150" y1="1116" x2="960" y2="1116" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="1110" text-anchor="middle" font-size="10.5" fill="#333">re-read and judge by routing power (SKILLS/meta/reconcile-summaries)</text>

  <line x1="960" y1="1143" x2="150" y2="1143" stroke="#777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="555" y="1137" text-anchor="middle" font-size="10.5" fill="#555">rewrite the summary — or vouch that it still fits</text>

  <line x1="150" y1="1170" x2="420" y2="1170" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="285" y="1164" text-anchor="middle" font-size="10.5" fill="#333">confirm-summary.sh (or the summary edit itself)</text>

  <line x1="420" y1="1197" x2="690" y2="1197" stroke="#333" stroke-width="1.3" marker-end="url(#call)"/>
  <text x="555" y="1191" text-anchor="middle" font-size="10.5" fill="#333"><tspan font-weight="bold">confirm-summary.sh:</tspan> record the verdict in .summary-hashes — judgment is recorded, never derived</text>

  <text x="540" y="1274" text-anchor="middle" font-size="11" fill="#888">Next session starts back at step 0 — someone has to paste the prompt again.</text>
  <text x="540" y="1292" text-anchor="middle" font-size="11" fill="#888">Full detail: TLDR.md · github.com/ricardopsantos/AgenticContext</text>
</svg>
